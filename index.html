<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Manager PRO+</title>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:20px
}

h1{
  text-align:center
}

textarea{
  width:100%;
  height:140px;
  border-radius:10px;
  border:none;
  padding:10px;
  margin-bottom:10px;
  background:#1e293b;
  color:#fff;
  resize:none
}

button{
  border:none;
  border-radius:8px;
  cursor:pointer
}

.btn-main{
  width:100%;
  padding:10px;
  background:#22c55e;
  color:#fff;
  font-weight:bold
}

#clock{
  text-align:center;
  margin-top:10px;
  font-size:14px;
  color:#94a3b8
}

.container{
  margin-top:20px
}

.card{
  background:#1e293b;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  transition:.3s
}

.card.proses{
  background:#78350f
}

.card.selesai{
  background:#064e3b
}

/* TODAY */
.card.today{
  border:2px solid #ef4444
}

/* TOMORROW */
.card.tomorrow{
  border:2px solid #f59e0b
}

/* H-2 */
.card.h2{
  border:2px solid #3b82f6
}

/* BLINK */
@keyframes blinkRed{
  0%{box-shadow:0 0 5px #ef4444}
  50%{box-shadow:0 0 20px #ef4444}
  100%{box-shadow:0 0 5px #ef4444}
}

.super-priority{
  animation:blinkRed 1s infinite;
  border:2px solid #ef4444!important
}

/* URGENT TEXT */
.urgent-big{
  display:block;
  font-size:12px;
  font-weight:bold;
  color:#ef4444;
  margin-bottom:4px;
  animation:blinkText 1s infinite
}

@keyframes blinkText{
  0%{opacity:1}
  50%{opacity:.3}
  100%{opacity:1}
}

.left{
  flex:1
}

.title{
  font-size:14px;
  line-height:1.7
}

.progress{
  font-size:11px;
  padding:3px 6px;
  border-radius:6px;
  margin-left:6px;
  border:none;
  color:#fff
}

.p-belum{
  background:#64748b
}

.p-proses{
  background:#f59e0b
}

.p-selesai{
  background:#22c55e
}

.tag{
  font-size:11px;
  padding:2px 6px;
  border-radius:6px;
  margin-right:5px;
  font-weight:bold;
  display:inline-block;
  margin-bottom:4px
}

.todayTag{
  background:#ef4444
}

.tomorrowTag{
  background:#f59e0b
}

.h2Tag{
  background:#3b82f6
}

.date{
  font-size:11px;
  color:#94a3b8;
  margin-top:4px
}

.countdown{
  font-size:11px;
  color:#38bdf8;
  margin-top:4px
}

.actions{
  display:flex;
  gap:5px
}

.actions button{
  padding:5px 6px;
  font-size:11px
}

.edit{
  background:#3b82f6;
  color:#fff
}

.delete{
  background:#ef4444;
  color:#fff
}
</style>
</head>

<body>

<h1>📦 Order Manager PRO+</h1>

<textarea id="input" placeholder="Contoh:
Servis motor senin 14:00
Meeting jumat 09:00
Ambil barang rabu
Deadline 28 mei 13:00"></textarea>

<button class="btn-main" onclick="tambah()">
Tambah
</button>

<div id="clock"></div>

<div class="container" id="output"></div>

<script>

let data = JSON.parse(
  localStorage.getItem("orders") || "[]"
)

/* ID */
function genId(){
  return Date.now().toString(36)
  + Math.random().toString(36).slice(2)
}

/* NORMALIZE TEXT */
function normalizeText(text){
  return text
    .toLowerCase()
    .replace(/[^\w\s]/g,'')
    .replace(/\s+/g,' ')
    .trim()
}

/* NORMALIZE DATE */
function normalize(d){

  if(!d) return null

  let x=new Date(d)

  x.setHours(0,0,0,0)

  return x
}

/* PARSE TANGGAL + HARI + JAM */
function parseTanggal(text){

  if(!text) return null

  text=text.toLowerCase()

  const bulan={
    januari:0,
    februari:1,
    maret:2,
    april:3,
    mei:4,
    juni:5,
    juli:6,
    agustus:7,
    september:8,
    oktober:9,
    november:10,
    desember:11
  }

  const hariMap={
    minggu:0,
    senin:1,
    selasa:2,
    rabu:3,
    kamis:4,
    jumat:5,
    sabtu:6
  }

  let now=new Date()

  /* DETEKSI JAM */

  let jamMatch=text.match(/(\d{1,2})[:.](\d{2})/)

  let jam=0
  let menit=0

  if(jamMatch){
    jam=parseInt(jamMatch[1])
    menit=parseInt(jamMatch[2])
  }

  /* DETEKSI TANGGAL */

  let tanggalMatch=text.match(
    /(\d{1,2})\s*(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)/
  )

  if(tanggalMatch){

    let result=new Date(
      now.getFullYear(),
      bulan[tanggalMatch[2]],
      parseInt(tanggalMatch[1]),
      jam,
      menit
    )

    if(result<now){
      result.setFullYear(now.getFullYear()+1)
    }

    return result
  }

  /* DETEKSI HARI */

  for(let h in hariMap){

    if(text.includes(h)){

      let targetHari=hariMap[h]

      let diff=(targetHari-now.getDay()+7)%7

      if(diff===0){

        let currentMinutes=
          now.getHours()*60+now.getMinutes()

        let targetMinutes=
          jam*60+menit

        if(targetMinutes<=currentMinutes){
          diff=7
        }
      }

      let result=new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()+diff,
        jam,
        menit
      )

      return result
    }
  }

  return null
}

/* STATUS HARI */
function getDayStatus(date){

  if(!date) return ""

  let now=new Date()

  let today=new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  )

  let target=new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  )

  let diff=Math.floor(
    (target-today)/86400000
  )

  if(diff===0) return "today"

  if(diff===1) return "tomorrow"

  if(diff===2) return "h2"

  return ""
}

/* BADGE REALTIME */
function getRealtimeBadge(date){

  if(!date) return ""

  let diff=date-new Date()

  let jam=diff/3600000

  if(diff<=0){
    return '<span class="tag todayTag">⛔ LEWAT</span>'
  }

  if(jam<=1){
    return '<span class="tag todayTag">🚨 <1 JAM</span>'
  }

  if(jam<=3){
    return '<span class="tag todayTag">⚠️ <3 JAM</span>'
  }

  if(jam<=6){
    return '<span class="tag tomorrowTag">⏰ <6 JAM</span>'
  }

  return ""
}

/* COUNTDOWN */
function getCountdown(date){

  if(!date) return ""

  let diff=date-new Date()

  if(diff<=0){
    return "⛔ Deadline terlewat"
  }

  let hari=Math.floor(diff/86400000)

  let jam=Math.floor(
    (diff%86400000)/3600000
  )

  let menit=Math.floor(
    (diff%3600000)/60000
  )

  if(hari>0){
    return `⏳ ${hari} hari ${jam} jam lagi`
  }

  if(jam>0){
    return `⏳ ${jam} jam ${menit} menit lagi`
  }

  return `⏳ ${menit} menit lagi`
}

/* SORT PRIORITAS */
function sortPrioritas(){

  data=data
  .map((d,i)=>({...d,_i:i}))
  .sort((a,b)=>{

    let da=parseTanggal(a.text)
    let db=parseTanggal(b.text)

    let now=new Date()

    function rank(item,date){

      if(!date) return 999

      let diff=date-now

      let jam=diff/3600000

      if(diff<=0) return 0

      if(jam<=1) return 1

      if(jam<=3) return 2

      if(jam<=6) return 3

      if(jam<=24) return 4

      if(jam<=48) return 5

      if(jam<=72) return 6

      if(item.progress==="proses") return 7

      if(item.progress==="belum") return 8

      return 9
    }

    let pa=rank(a,da)
    let pb=rank(b,db)

    if(pa!==pb) return pa-pb

    if(!da&&!db) return a._i-b._i

    if(!da) return 1

    if(!db) return -1

    return da-db

  }).map(({_i,...r})=>r)
}

/* TAMBAH */
function tambah(){

  let lines=document
    .getElementById("input")
    .value
    .split("\n")

  lines.forEach(x=>{

    let clean=x.trim()

    if(!clean) return

    let newText=normalizeText(clean)

    let sudahAda=data.some(
      d=>normalizeText(d.text)===newText
    )

    if(!sudahAda){

      data.push({
        id:genId(),
        text:clean,
        progress:"belum"
      })
    }

  })

  sortPrioritas()

  simpan()

  render()

  document.getElementById("input").value=""
}

/* HAPUS */
function hapus(id){

  data=data.filter(x=>x.id!==id)

  sortPrioritas()

  simpan()

  render()
}

/* EDIT */
function edit(id){

  let item=data.find(x=>x.id===id)

  if(!item) return

  let baru=prompt("Edit:",item.text)

  if(baru&&baru.trim()){

    item.text=baru.trim()

    sortPrioritas()

    simpan()

    render()
  }
}

/* UPDATE PROGRESS */
function updateProgress(id,val){

  let item=data.find(x=>x.id===id)

  if(!item) return

  item.progress=val

  sortPrioritas()

  simpan()

  render()
}

/* RENDER */
function render(){

  let html=""

  data.forEach(d=>{

    let date=parseTanggal(d.text)

    let day=getDayStatus(date)

    let realtime=getRealtimeBadge(date)

    let countdown=getCountdown(date)

    let isSuper=false

    if(date){

      let diff=date-new Date()

      let jam=diff/3600000

      if(jam<=1){
        isSuper=true
      }
    }

    html+=`
    <div class="card ${d.progress} ${day} ${isSuper?'super-priority':''}">

      <div class="left">

        <div class="title">

          ${isSuper
            ? '<span class="urgent-big">⚠️ SUPER PRIORITAS</span>'
            : ''
          }

          ${
            day==="today"
              ? '<span class="tag todayTag">🔴 HARI INI</span>'

            : day==="tomorrow"
              ? '<span class="tag tomorrowTag">🟠 BESOK</span>'

            : day==="h2"
              ? '<span class="tag h2Tag">🔵 H-2</span>'

            : ''
          }

          ${realtime}

          ${d.text}

          <select
            class="progress p-${d.progress}"
            onchange="updateProgress('${d.id}',this.value)"
          >

            <option
              value="belum"
              ${d.progress==="belum"?"selected":""}
            >
              Belum
            </option>

            <option
              value="proses"
              ${d.progress==="proses"?"selected":""}
            >
              Proses
            </option>

            <option
              value="selesai"
              ${d.progress==="selesai"?"selected":""}
            >
              Selesai
            </option>

          </select>

        </div>

        <div class="date">

          ${
            date
              ? date.toLocaleString(
                  "id-ID",
                  {
                    weekday:'long',
                    day:'numeric',
                    month:'long',
                    hour:'2-digit',
                    minute:'2-digit'
                  }
                )
              : "Tidak ada tanggal"
          }

        </div>

        ${
          date
            ? `<div class="countdown">${countdown}</div>`
            : ''
        }

      </div>

      <div class="actions">

        <button
          class="edit"
          onclick="edit('${d.id}')"
        >
          ✏️
        </button>

        <button
          class="delete"
          onclick="hapus('${d.id}')"
        >
          🗑️
        </button>

      </div>

    </div>`
  })

  document.getElementById("output").innerHTML=html
}

/* CLOCK */
setInterval(()=>{

  document.getElementById("clock")
  .innerText=new Date()
  .toLocaleString("id-ID")

},1000)

/* AUTO REFRESH */
setInterval(()=>{
  render()
},60000)

function simpan(){
  localStorage.setItem(
    "orders",
    JSON.stringify(data)
  )
}

render()

</script>

</body>
</html>
