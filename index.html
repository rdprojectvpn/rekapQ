<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Order Manager PRO MAX</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:'Segoe UI',sans-serif;
  background:#0f172a;
  color:white;
}

/* HEADER */
h1{
  text-align:center;
  margin-bottom:10px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:20px;
  font-size:14px;
}

/* INPUT */
textarea{
  width:100%;
  height:130px;
  border:none;
  border-radius:14px;
  padding:14px;
  background:#1e293b;
  color:white;
  resize:none;
  outline:none;
  margin-bottom:10px;
  font-size:14px;
}

.btn-main{
  width:100%;
  padding:13px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
}

.btn-main:hover{
  opacity:.9;
}

/* CLOCK */
#clock{
  margin-top:15px;
  text-align:center;
  color:#94a3b8;
  font-size:14px;
}

/* LIST */
.container{
  margin-top:20px;
}

.card{
  background:#1e293b;
  border-radius:16px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
  transition:.3s;
}

.card.proses{
  background:#78350f;
}

.card.selesai{
  background:#064e3b;
}

/* PRIORITY COLORS */
.card.today{
  border:2px solid #ef4444;
}

.card.tomorrow{
  border:2px solid #f59e0b;
}

.card.h2{
  border:2px solid #3b82f6;
}

/* SUPER PRIORITY */
@keyframes blinkRed{
  0%{box-shadow:0 0 5px #ef4444}
  50%{box-shadow:0 0 20px #ef4444}
  100%{box-shadow:0 0 5px #ef4444}
}

.super-priority{
  animation:blinkRed 1s infinite;
}

/* BLINK TEXT */
@keyframes blinkText{
  0%{opacity:1}
  50%{opacity:.3}
  100%{opacity:1}
}

.urgent-big{
  display:block;
  color:#ef4444;
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
  animation:blinkText 1s infinite;
}

/* CONTENT */
.left{
  flex:1;
}

.title{
  line-height:1.7;
  font-size:14px;
}

/* TAG */
.tag{
  display:inline-block;
  padding:3px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:bold;
  margin-right:5px;
  margin-bottom:5px;
}

.todayTag{
  background:#ef4444;
}

.tomorrowTag{
  background:#f59e0b;
}

.h2Tag{
  background:#3b82f6;
}

/* COUNTDOWN */
.countdown{
  margin-top:6px;
  color:#38bdf8;
  font-size:11px;
}

/* DATE */
.date{
  margin-top:5px;
  font-size:11px;
  color:#94a3b8;
}

/* STATUS */
.progress{
  margin-left:8px;
  border:none;
  border-radius:8px;
  padding:4px 6px;
  font-size:11px;
  color:white;
}

.p-belum{
  background:#64748b;
}

.p-proses{
  background:#f59e0b;
}

.p-selesai{
  background:#22c55e;
}

/* BUTTON */
.actions{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.actions button{
  border:none;
  border-radius:8px;
  padding:7px;
  cursor:pointer;
  color:white;
}

.edit{
  background:#3b82f6;
}

.delete{
  background:#ef4444;
}

.empty{
  text-align:center;
  color:#94a3b8;
  margin-top:30px;
}

</style>
</head>

<body>

<h1>📦 Order Manager PRO MAX</h1>

<div class="subtitle">
Realtime deadline priority system
</div>

<textarea id="input" placeholder="Contoh:
Servis motor 28 Mei 14:00
Ambil barang 30 Mei 09:30
Meeting client 1 Juni 20:00"></textarea>

<button class="btn-main" onclick="tambah()">
Tambah Order
</button>

<div id="clock"></div>

<div class="container" id="output"></div>

<script>

/* =========================
   DATABASE
========================= */

let data = JSON.parse(
  localStorage.getItem("orders") || "[]"
)

/* =========================
   GENERATE ID
========================= */

function genId(){
  return Date.now().toString(36)
    + Math.random().toString(36).slice(2)
}

/* =========================
   NORMALIZE TEXT
========================= */

function normalizeText(text){

  return text
    .toLowerCase()
    .replace(/[^\w\s]/g,'')
    .replace(/\s+/g,' ')
    .trim()
}

/* =========================
   PARSE TANGGAL + JAM
========================= */

function parseTanggal(text){

  if(!text) return null

  const bulan={
    januari:0,
    februari:1,
    maret:2,
    april:3,
    mei:4,
    juni:5,
    juli:6,
    agustus:7,
    september:8,
    oktober:9,
    november:10,
    desember:11
  }

  text=text.toLowerCase()

  let match=text.match(
    /(\d{1,2})\s*(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)(?:.*?(\d{1,2})[:.](\d{2}))?/
  )

  if(match){

    let now=new Date()

    let hari=parseInt(match[1])

    let bulanIndex=bulan[match[2]]

    let jam=match[3]
      ? parseInt(match[3])
      : 0

    let menit=match[4]
      ? parseInt(match[4])
      : 0

    let result=new Date(
      now.getFullYear(),
      bulanIndex,
      hari,
      jam,
      menit
    )

    if(result < now){
      result.setFullYear(now.getFullYear()+1)
    }

    return result
  }

  return null
}

/* =========================
   DAY STATUS
========================= */

function getDayStatus(date){

  if(!date) return ""

  let now=new Date()

  let today=new Date(
    now.getFullYear(),
    now.getMonth(),
    now.getDate()
  )

  let target=new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  )

  let diff=Math.floor(
    (target-today)/86400000
  )

  if(diff===0) return "today"

  if(diff===1) return "tomorrow"

  if(diff===2) return "h2"

  return ""
}

/* =========================
   COUNTDOWN
========================= */

function getCountdown(date){

  if(!date) return ""

  let now=new Date()

  let diff=date-now

  if(diff<=0){
    return "⛔ Deadline terlewat"
  }

  let hari=Math.floor(diff/86400000)

  let jam=Math.floor(
    (diff%86400000)/3600000
  )

  let menit=Math.floor(
    (diff%3600000)/60000
  )

  if(hari>0){
    return `⏳ ${hari} hari ${jam} jam lagi`
  }

  if(jam>0){
    return `⏳ ${jam} jam ${menit} menit lagi`
  }

  return `⏳ ${menit} menit lagi`
}

/* =========================
   REALTIME BADGE
========================= */

function getRealtimeBadge(date){

  if(!date) return ""

  let diff=date-new Date()

  let jam=diff/3600000

  if(diff<=0){
    return `
    <span class="tag todayTag">
    ⛔ LEWAT DEADLINE
    </span>
    `
  }

  if(jam<=1){
    return `
    <span class="tag todayTag">
    🚨 <1 JAM
    </span>
    `
  }

  if(jam<=3){
    return `
    <span class="tag todayTag">
    ⚠️ <3 JAM
    </span>
    `
  }

  if(jam<=6){
    return `
    <span class="tag tomorrowTag">
    ⏰ <6 JAM
    </span>
    `
  }

  return ""
}

/* =========================
   SORT PRIORITAS
========================= */

function sortPrioritas(){

  data=data
  .map((d,i)=>({...d,_i:i}))
  .sort((a,b)=>{

    let da=parseTanggal(a.text)

    let db=parseTanggal(b.text)

    let now=new Date()

    function getPriority(item,date){

      if(!date) return 999

      let diff=date-now

      let jam=diff/3600000

      /* OVERDUE */
      if(diff<=0){
        return 0
      }

      /* <1 JAM */
      if(jam<=1){
        return 1
      }

      /* <3 JAM */
      if(jam<=3){
        return 2
      }

      /* <6 JAM */
      if(jam<=6){
        return 3
      }

      /* HARI INI */
      if(jam<=24){
        return 4
      }

      /* BESOK */
      if(jam<=48){
        return 5
      }

      /* H-2 */
      if(jam<=72){
        return 6
      }

      /* PROSES */
      if(item.progress==="proses"){
        return 7
      }

      /* BELUM */
      if(item.progress==="belum"){
        return 8
      }

      /* DONE */
      return 9
    }

    let pa=getPriority(a,da)

    let pb=getPriority(b,db)

    if(pa!==pb){
      return pa-pb
    }

    if(!da&&!db){
      return a._i-b._i
    }

    if(!da) return 1

    if(!db) return -1

    return da-db

  })
  .map(({_i,...r})=>r)
}

/* =========================
   ADD
========================= */

function tambah(){

  let lines=document
    .getElementById("input")
    .value
    .split("\n")

  lines.forEach(line=>{

    let clean=line.trim()

    if(!clean) return

    let newText=normalizeText(clean)

    let sudahAda=data.some(
      d=>normalizeText(d.text)===newText
    )

    if(!sudahAda){

      data.push({
        id:genId(),
        text:clean,
        progress:"belum"
      })
    }

  })

  sortPrioritas()

  simpan()

  render()

  document.getElementById("input").value=""
}

/* =========================
   DELETE
========================= */

function hapus(id){

  data=data.filter(x=>x.id!==id)

  simpan()

  render()
}

/* =========================
   EDIT
========================= */

function edit(id){

  let item=data.find(x=>x.id===id)

  if(!item) return

  let baru=prompt(
    "Edit order:",
    item.text
  )

  if(baru && baru.trim()){

    item.text=baru.trim()

    sortPrioritas()

    simpan()

    render()
  }
}

/* =========================
   UPDATE STATUS
========================= */

function updateProgress(id,val){

  let item=data.find(
    x=>x.id===id
  )

  if(!item) return

  item.progress=val

  sortPrioritas()

  simpan()

  render()
}

/* =========================
   SAVE
========================= */

function simpan(){

  localStorage.setItem(
    "orders",
    JSON.stringify(data)
  )
}

/* =========================
   RENDER
========================= */

function render(){

  sortPrioritas()

  if(data.length===0){

    document.getElementById("output")
    .innerHTML=`
      <div class="empty">
      Belum ada order
      </div>
    `
    return
  }

  let html=""

  data.forEach(d=>{

    let date=parseTanggal(d.text)

    let day=getDayStatus(date)

    let countdown=getCountdown(date)

    let realtime=getRealtimeBadge(date)

    let isSuper=false

    if(date){

      let diff=date-new Date()

      let jam=diff/3600000

      if(jam<=1){
        isSuper=true
      }
    }

    html+=`

    <div class="
      card
      ${d.progress}
      ${day}
      ${isSuper ? 'super-priority' : ''}
    ">

      <div class="left">

        ${
          isSuper
          ? `
          <span class="urgent-big">
          🚨 SUPER PRIORITAS
          </span>
          `
          : ''
        }

        <div class="title">

          ${
            day==="today"
            ? `
            <span class="tag todayTag">
            🔴 HARI INI
            </span>
            `
            : ''
          }

          ${
            day==="tomorrow"
            ? `
            <span class="tag tomorrowTag">
            🟠 BESOK
            </span>
            `
            : ''
          }

          ${
            day==="h2"
            ? `
            <span class="tag h2Tag">
            🔵 H-2
            </span>
            `
            : ''
          }

          ${realtime}

          ${d.text}

          <select
            class="progress p-${d.progress}"
            onchange="
              updateProgress(
                '${d.id}',
                this.value
              )
            "
          >

            <option
              value="belum"
              ${d.progress==="belum"
                ?"selected":""
              }
            >
            Belum
            </option>

            <option
              value="proses"
              ${d.progress==="proses"
                ?"selected":""
              }
            >
            Proses
            </option>

            <option
              value="selesai"
              ${d.progress==="selesai"
                ?"selected":""
              }
            >
            Selesai
            </option>

          </select>

        </div>

        <div class="date">

          ${
            date
            ? date.toLocaleString(
              "id-ID",
              {
                weekday:'long',
                day:'numeric',
                month:'long',
                hour:'2-digit',
                minute:'2-digit'
              }
            )
            : 'Tidak ada tanggal'
          }

        </div>

        ${
          date
          ? `
          <div class="countdown">
          ${countdown}
          </div>
          `
          : ''
        }

      </div>

      <div class="actions">

        <button
          class="edit"
          onclick="edit('${d.id}')"
        >
        ✏️
        </button>

        <button
          class="delete"
          onclick="hapus('${d.id}')"
        >
        🗑️
        </button>

      </div>

    </div>
    `
  })

  document.getElementById("output")
  .innerHTML=html
}

/* =========================
   CLOCK
========================= */

setInterval(()=>{

  document.getElementById("clock")
  .innerText=
    new Date().toLocaleString("id-ID")

},1000)

/* =========================
   AUTO REFRESH
========================= */

setInterval(()=>{

  render()

},60000)

/* =========================
   INIT
========================= */

render()

</script>

</body>
</html>
