<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Manager PRO+</title>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#0f172a;
  color:#fff;
  margin:0;
  padding:20px;
}

h1{text-align:center;}

textarea{
  width:100%;
  height:140px;
  border-radius:10px;
  border:none;
  padding:10px;
  margin-bottom:10px;
}

button{
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.btn-main{
  width:100%;
  padding:10px;
  background:#22c55e;
  color:#fff;
}

#clock{
  text-align:center;
  margin-top:10px;
  font-size:14px;
  color:#94a3b8;
}

.container{margin-top:20px;}

.card{
  background:#1e293b;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:grab;
  transition:0.2s;
}

.card.dragging{opacity:0.5;}

.card.proses{background:#78350f;}
.card.selesai{background:#064e3b;}

/* 🔥 REMINDER */
.card.today{
  border:2px solid #ef4444;
  box-shadow:0 0 10px #ef4444;
}

.card.tomorrow{
  border:2px solid #f59e0b;
  box-shadow:0 0 10px #f59e0b;
}

.left{flex:1;}
.title{font-size:14px;}

.progress{
  font-size:11px;
  padding:3px 6px;
  border-radius:6px;
  margin-left:6px;
}

.p-belum{background:#64748b;}
.p-proses{background:#f59e0b;}
.p-selesai{background:#22c55e;}

.tag{
  font-size:11px;
  padding:2px 6px;
  border-radius:6px;
  margin-right:5px;
}

.urgent{background:#ef4444;}
.soon{background:#f59e0b;}
.normal{background:#64748b;}
.doneTag{background:#22c55e;}

.todayTag{background:#ef4444;}
.tomorrowTag{background:#f59e0b;}

.date{
  font-size:11px;
  color:#94a3b8;
}

.actions{
  display:flex;
  gap:5px;
}

.actions button{
  padding:5px 6px;
  font-size:11px;
}

.edit{background:#3b82f6;color:#fff;}
.delete{background:#ef4444;color:#fff;}
</style>
</head>

<body>

<h1>📦 Order Manager PRO+</h1>

<textarea id="input" placeholder="Paste data order..."></textarea>
<button class="btn-main" onclick="tambah()">Tambah</button>

<div id="clock"></div>

<div class="container" id="output"></div>

<script>
let data = JSON.parse(localStorage.getItem("orders") || "[]")

function parseTanggal(text){
  const bulan = {
    januari:0,februari:1,maret:2,april:3,mei:4,juni:5,
    juli:6,agustus:7,september:8,oktober:9,november:10,desember:11
  }

  let m = text.toLowerCase().match(/(\d{1,2})\s*(januari|februari|maret|april|mei|juni|juli|agustus|september|oktober|november|desember)/)
  if(m) return new Date(2026, bulan[m[2]], m[1])

  if(text.toLowerCase().includes("senin")) return new Date(Date.now()+1*86400000)
  if(text.toLowerCase().includes("rabu")) return new Date(Date.now()+3*86400000)
  if(text.toLowerCase().includes("jumat")) return new Date(Date.now()+5*86400000)

  return null
}

/* 🔥 DETEKSI HARI H & BESOK */
function getDayStatus(date){
  if(!date) return ""

  let today = new Date()
  today.setHours(0,0,0,0)

  let d = new Date(date)
  d.setHours(0,0,0,0)

  let diff = (d - today)/(1000*60*60*24)

  if(diff === 0) return "today"
  if(diff === 1) return "tomorrow"
  return ""
}

function getStatus(date, progress){
  if(progress === "selesai") return "done"
  if(!date) return "normal"

  let diff = (date - new Date())/(1000*60*60*24)

  if(diff <= 1) return "urgent"
  if(diff <= 3) return "soon"
  return "normal"
}

function tambah(){
  let input = document.getElementById("input").value.split("\n")

  input.forEach(x=>{
    if(x.trim()){
      data.push({
        id: Date.now() + Math.random(),
        text: x,
        progress:"belum"
      })
    }
  })

  document.getElementById("input").value=""
  simpan()
  render()
}

function simpan(){
  localStorage.setItem("orders", JSON.stringify(data))
}

function hapus(id){
  data = data.filter(x=>x.id!==id)
  simpan()
  render()
}

function edit(id){
  let item = data.find(x=>x.id===id)
  let baru = prompt("Edit order:", item.text)
  if(baru){
    item.text = baru
    simpan()
    render()
  }
}

function updateProgress(id,val){
  let item = data.find(x=>x.id===id)
  item.progress = val
  simpan()
  render()
}

function render(){
  let list = data.map(d=>{
    let date = parseTanggal(d.text)
    return {...d, date, status:getStatus(date,d.progress), day:getDayStatus(date)}
  })

  list.sort((a,b)=>{
    if(a.progress==="selesai" && b.progress!=="selesai") return 1
    if(a.progress!=="selesai" && b.progress==="selesai") return -1
    if(!a.date) return -1
    if(!b.date) return 1
    return a.date - b.date
  })

  let html=""

  list.forEach((d,i)=>{
    html+=`
    <div class="card ${d.progress} ${d.day}" draggable="true" data-index="${i}">
      <div class="left">
        <div class="title">

          ${
            d.day==="today" ? '<span class="tag todayTag">🔴 HARI INI</span>' :
            d.day==="tomorrow" ? '<span class="tag tomorrowTag">🟠 BESOK</span>' : ''
          }

          <span class="tag ${
            d.status=="done"?"doneTag":
            d.status=="urgent"?"urgent":
            d.status=="soon"?"soon":"normal"
          }">
            ${
              d.status=="done"?"🟢":
              d.status=="urgent"?"🔴":
              d.status=="soon"?"🟡":"⚪"
            }
          </span>

          ${d.text}

          <select class="progress p-${d.progress}" onchange="updateProgress(${d.id}, this.value)">
            <option value="belum" ${d.progress=="belum"?"selected":""}>Belum</option>
            <option value="proses" ${d.progress=="proses"?"selected":""}>Proses</option>
            <option value="selesai" ${d.progress=="selesai"?"selected":""}>Selesai</option>
          </select>
        </div>

        <div class="date">
          ${d.date ? d.date.toDateString() : "Tidak ada tanggal"}
        </div>
      </div>

      <div class="actions">
        <button class="edit" onclick="edit(${d.id})">✏️</button>
        <button class="delete" onclick="hapus(${d.id})">🗑️</button>
      </div>
    </div>
    `
  })

  document.getElementById("output").innerHTML = html

  dragInit()
}

/* DRAG */
function dragInit(){
  const cards = document.querySelectorAll('.card')
  let dragIndex = null

  cards.forEach(card=>{
    card.addEventListener('dragstart',()=>{
      dragIndex = card.dataset.index
      card.classList.add('dragging')
    })

    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging')
    })

    card.addEventListener('dragover',(e)=>e.preventDefault())

    card.addEventListener('drop',()=>{
      let dropIndex = card.dataset.index

      let temp = data[dragIndex]
      data.splice(dragIndex,1)
      data.splice(dropIndex,0,temp)

      simpan()
      render()
    })
  })
}

/* CLOCK */
function updateClock(){
  const now = new Date()

  const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"]
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"]

  let h = hari[now.getDay()]
  let tgl = now.getDate()
  let b = bulan[now.getMonth()]
  let th = now.getFullYear()

  let jam = now.getHours().toString().padStart(2,'0')
  let menit = now.getMinutes().toString().padStart(2,'0')
  let detik = now.getSeconds().toString().padStart(2,'0')

  document.getElementById("clock").innerHTML =
    `${h}, ${tgl} ${b} ${th} • ${jam}:${menit}:${detik}`
}

setInterval(updateClock,1000)
updateClock()

render()
</script>

</body>
</html>
